<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Tawassoul</h1>
        </nav>
        <div>
            <p class="para">Géstionnaies des participants</p>
        </div>
    </header>
    <section class="statistique">
            <div>
                <p>Total des participants</p>
                <span id="total-participant">5</span>
            </div>
            <div>
                <p>Participants sélectionnés</p>
                <span id="participant-selectionne">3</span>
            </div>
        </section>
    <main>
        
        <form id="form">
            <h2>Ajouter des participants</h2>
            <div>
                <label for="name">Nom complet </label>
                <input type="text" placeholder="votre nom complet" id="nom">
                <span id="msg-erreur-nom"></span>
            </div>
            <div>
                <label for="formation">Formation</label>
                <select name="formation" id="formation">
                    <option value="langues">Langues</option>
                    <option value="web">Web</option>
                    <option value="bureautique">Bureautique</option>
                </select>            
            </div>
            <div>
                <label for="email">Email</label>
                <input type="text" placeholder="votre email @gmail.com" id="email">
                <span id="msg-erreur"></span>
            </div>
            <button type="submit" id="button">Enregistrer participant</button>

        </form>

        <section class="liste" id="liste"> 
                       <aside>
            <h3>Filtrer</h3>
            <div>
                <input id="rechercher" type="text" placeholder="entrer le nom chercher">
            </div>
            <div>
                <button type="button" class="btn-filter" data-formation="tout">Tout</button>
                <button type="button" class="btn-filter" data-formation="bureautique">Bureautique</button>
                <button type="button" class="btn-filter" data-formation="web">Web</button>
                <button type="button" class="btn-filter" data-formation="langues">Langues</button>
            </div>
        </aside>
            <h2>Liste des participants</h2>   
            <button type="button" id="supprimer-selection">Supprimer sélection</button>           
        </section>
    </main>  
    
    <script src="./src/app.js" type="module"></script>
</body>
</html>
